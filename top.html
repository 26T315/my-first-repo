<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>旅行プラン集</title>

<style>

body{
    margin:0;
    font-family:"Yu Gothic",sans-serif;
    background:#f2f8ff;
}

header{
    background:#4da6ff;
    color:white;
    text-align:center;
    padding:40px;
}

header h1{
    margin:0;
    font-size:45px;
}

header p{
    font-size:20px;
}

main{
    width:90%;
    margin:auto;
    display:flex;
    justify-content:space-around;
    flex-wrap:wrap;
    margin-top:40px;
}

.plan{
    width:300px;
    background:white;
    border-radius:15px;
    box-shadow:0 0 10px gray;
    text-align:center;
    margin:20px;
    padding:20px;
}

.plan img{
    width:100%;
    height:200px;
    object-fit:cover;
    border-radius:10px;
}

.plan h2{
    color:#0066cc;
}

.plan p{
    line-height:1.6;
}

.button{
    display:inline-block;
    background:#0066cc;
    color:white;
    padding:12px 25px;
    text-decoration:none;
    border-radius:8px;
    margin-top:10px;
}

.button:hover{
    background:#003f80;
}

footer{
    margin-top:40px;
    background:#0066cc;
    color:white;
    text-align:center;
    padding:15px;
}

</style>

</head>

<body>

<header>

<h1>旅行プラン集</h1>

<p>
おすすめ旅行プランをご紹介します！
</p>

</header>

<main>

<div class="plan">

<img src="korea.jpg" alt="韓国旅行">

<h2>韓国旅行</h2>

<p>
ソウルの観光地や韓国グルメ、
ショッピングを楽しむ2泊3日の旅行プランです。
</p>

<a href="korea.html" class="button">
詳しく見る
</a>

</div>

<div class="plan">

<img src="disney.jpg" alt="ディズニー旅行">

<h2>ディズニー旅行</h2>

<p>
1日目は東京ディズニーランド、
2日目は東京ディズニーシーを満喫するプランです。
</p>

<a href="disney.html" class="button">
詳しく見る
</a>

</div>

<div class="plan">

<img src="osaka.jpg" alt="大阪旅行">

<h2>大阪旅行</h2>

<p>
大阪城・道頓堀・ユニバーサル・スタジオ・ジャパンなど
人気スポットを巡る旅行プランです。
</p>

<a href="osaka.html" class="button">
詳しく見る
</a>

</div>

</main>

<footer>

<p>
© 2026 旅行プラン集
</p>

</footer>

</body>
</html>
